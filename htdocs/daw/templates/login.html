<!DOCTYPE html>
<html lang="en">
<head>
    <title>TechMarket | Login</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/daw/styles/style.css">
    <script src="/daw/scripts/script.js"></script>
    <link rel="icon" href="../images/icons/logo.png">
    <meta name="author" content="Mihoubi Youcef">
    <script src="https://cdn.counter.dev/script.js" data-id="f7dc9020-1df7-44db-9236-a8e027d2c311" data-utcoffset="1"></script>
</head>

<body>
    <header>
        <table width="100%">
            <tr>
                <td>
                    <a href="/daw/templates/index.html">
                        <h1>TechMarket</h1>
                    </a>
                </td>
                <td align="right">
                    <a href="/daw/templates/login.html">Login</a> |
                    <a href="/daw/templates/signup.html">Sign Up</a>
                    <button onclick="toggleTheme()" style="float:right; margin-right: 10px;">🌓Dark Mode</button>
                </td>
            </tr>
        </table>
    </header>

    <form method="post" action="/daw/php/login.php" onsubmit="return check_login(event)">
    <center><h1>Welcome</h1></center>
    <table border="0" width="40%" align="center">
        <thead>
            <tr>
                <th colspan="2" id="login_bg">
                    <img src="/daw/images/icons/think.png" alt="Login" height="90" id="login_img">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><b>Email Address</b></td>
                <td><input type="email" placeholder="Email Address" id="email" name="email"oninput="typing_email()"></td>
            </tr>
            <tr>
                <td><b>Password</b></td>
                <td><input type="password" placeholder="Password" id="password" name="password" oninput="typing()"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="button" onclick="check_login()">Login</button>
                    <button type="reset" onclick="unlogin()">Clear</button>
                </td>
            </tr>
            <tr>
                <td><b>Don't have an account?</b></td>
                <td><a href="/daw/templates/signup.html">Sign Up</a></td>
            </tr>
        </tbody>
    </table>
    <p id="msg" name="msg"></p>
    
</form>

</body>
</html>
